name: ci
on: [push, pull_request]

# gitleaks-action needs to list a PR's commits on pull_request events; the
# default restricted GITHUB_TOKEN 403s that call and fails the job before any
# scanning happens (every PR showed a red gitleaks ✗ while the push-event scan
# of the same commits passed).
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:gates
